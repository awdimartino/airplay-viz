# Leave the USB DAC and the visualizer loopback to shairport-sync / cava
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-TTGK_Technology_Co._Ltd_KM-HIFI-384KHZ-00" }
      { device.name = "alsa_card.platform-snd_aloop.0" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
