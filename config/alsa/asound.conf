# AirPlay output: USB DAC + loopback copy for the cava visualizer
pcm.airplay {
  type plug
  slave.pcm "airplay_multi"
  route_policy duplicate
}
pcm.airplay_multi {
  type multi
  slaves.a.pcm "hw:KMHIFI384KHZ,0"
  slaves.a.channels 2
  slaves.b.pcm "hw:Loopback,0,0"
  slaves.b.channels 2
  bindings.0 { slave a; channel 0; }
  bindings.1 { slave a; channel 1; }
  bindings.2 { slave b; channel 0; }
  bindings.3 { slave b; channel 1; }
}
ctl.airplay_multi {
  type hw
  card KMHIFI384KHZ
}
