general = {
  name = "Alex Pi";
  output_backend = "alsa";
  audio_backend_latency_offset_in_seconds = -1.0; // play ~1s earlier than AirPlay default (~2s) for snappier controls
  audio_backend_buffer_desired_length_in_seconds = 0.35; // audio reaches the visualizer loopback this far ahead of the speakers
};
alsa = {
  output_device = "airplay";
  mixer_control_name = "PCM";
  mixer_device = "hw:KMHIFI384KHZ";
  disable_standby_mode = "always";
};
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  cover_art_cache_directory = "";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
